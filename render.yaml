services:
  - type: web
    name: resolveai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SWIGGY_CLIENT_ID
        sync: false
      - key: SWIGGY_REDIRECT_URI
        sync: false
      - key: SWIGGY_FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://resolveai-frontend-9f0z.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SWIGGY_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: tiny

  - type: web
    runtime: static
    name: resolveai-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://resolveai-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
